<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleRecord Lite</title>

    <link rel="icon" type="image/x-icon" href="./images/logit.ico" />

    <!-- Google Fonts: Montserrat + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols (new design icons) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <header id="main-header"></header>

    <main>
      <!-- Dynamic content injected by the router -->
    </main>

    <!-- Generic modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-content">
        <span class="modal-close" id="modal-close">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>

    <footer id="main-footer"></footer>
  </body>
</html>
