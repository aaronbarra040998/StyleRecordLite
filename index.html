<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleRecord Lite | Valida teléfonos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/mirror-icon.svg" />
  </head>
  <body>
    <div class="app-container">
      <header class="main-header">
        <div class="logo">
          <span class="logo-icon">🪞⚡</span>
          <h1>StyleRecord<span class="light">Lite</span></h1>
        </div>
        <p class="tagline">Registro rápido para profesionales</p>
      </header>

      <main>
        <!-- Panel de validación de teléfono (Numverify) -->
        <section class="card phone-validation">
          <h2>Validar número de cliente</h2>
          <form id="phoneForm">
            <div class="input-group">
              <label for="phone">Número de teléfono (código país)</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="+34987654321"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary" id="validateBtn">
              Validar con Numverify
            </button>
          </form>
          <div id="validationResult" class="result-area" aria-live="polite">
            <!-- Aquí se mostrarán los datos de la API -->
          </div>
        </section>

        <!-- Demostración de localStorage (storage.js) -->
        <section class="card storage-demo">
          <h2>Prueba de almacenamiento local</h2>
          <button id="saveTestBtn" class="btn btn-secondary">
            Guardar validación de ejemplo
          </button>
          <button id="loadTestBtn" class="btn btn-outline">
            Cargar última validación
          </button>
          <pre id="storageOutput" class="storage-output">(vacío)</pre>
        </section>
      </main>

      <footer>
        <p>© 2025 StyleRecord Lite – Validación con Numverify</p>
      </footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
